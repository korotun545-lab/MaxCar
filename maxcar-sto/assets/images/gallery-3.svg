<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t3">
  <title id="t3">Замена масла — иллюстрация-заглушка</title>
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22303f" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121722"/>
      <stop offset="1" stop-color="#0c0f16"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>
  <rect width="800" height="600" fill="url(#grid3)"/>

  <!-- oil can -->
  <g transform="translate(280,160)">
    <path d="M 0 60 L 0 260 Q 0 280 20 280 L 140 280 Q 160 280 160 260 L 160 60 Z" fill="#1b2330" stroke="#3a4a5c" stroke-width="2"/>
    <rect x="0" y="30" width="160" height="34" rx="6" fill="#232d3c"/>
    <path d="M 120 30 L 220 -10 L 226 8 L 132 46 Z" fill="#FFC53D"/>
    <circle cx="80" cy="170" r="46" fill="none" stroke="#4FA8FF" stroke-width="3"/>
    <path d="M 80 140 L 80 170 L 100 190" fill="none" stroke="#4FA8FF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- drip -->
  <path d="M 470 260 C 470 300 440 300 440 330 C 440 350 460 360 470 360 C 480 360 500 350 500 330 C 500 300 470 300 470 260 Z" fill="#FFC53D" opacity="0.9"/>
  <ellipse cx="470" cy="420" rx="46" ry="10" fill="#FFC53D" opacity="0.25"/>

  <text x="60" y="70" font-family="Arial, sans-serif" font-size="20" fill="#5b6b7c" letter-spacing="2">ЗАМЕНА МАСЛА</text>
</svg>
