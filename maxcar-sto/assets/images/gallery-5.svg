<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t5">
  <title id="t5">Ремонт коробки передач — иллюстрация-заглушка</title>
  <defs>
    <pattern id="grid5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22303f" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121722"/>
      <stop offset="1" stop-color="#0c0f16"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg5)"/>
  <rect width="800" height="600" fill="url(#grid5)"/>

  <!-- gear cluster -->
  <g fill="none" stroke="#FFC53D" stroke-width="4">
    <g transform="translate(330,280)">
      <circle r="70"/>
      <g id="teethA">
        <rect x="-6" y="-84" width="12" height="24"/>
        <rect x="-6" y="60" width="12" height="24"/>
        <rect x="-84" y="-6" width="24" height="12"/>
        <rect x="60" y="-6" width="24" height="12"/>
      </g>
      <circle r="18" fill="#0c0f16"/>
    </g>
  </g>

  <g fill="none" stroke="#4FA8FF" stroke-width="4">
    <g transform="translate(470,220)">
      <circle r="46"/>
      <rect x="-6" y="-58" width="12" height="18"/>
      <rect x="-6" y="40" width="12" height="18"/>
      <rect x="-58" y="-6" width="18" height="12"/>
      <rect x="40" y="-6" width="18" height="12"/>
      <circle r="12" fill="#0c0f16"/>
    </g>
  </g>

  <g fill="none" stroke="#5b6b7c" stroke-width="3">
    <g transform="translate(500,360)">
      <circle r="34"/>
      <rect x="-4" y="-42" width="8" height="14"/>
      <rect x="-4" y="28" width="8" height="14"/>
      <rect x="-42" y="-4" width="14" height="8"/>
      <rect x="28" y="-4" width="14" height="8"/>
      <circle r="9" fill="#0c0f16"/>
    </g>
  </g>

  <text x="60" y="70" font-family="Arial, sans-serif" font-size="20" fill="#5b6b7c" letter-spacing="2">РЕМОНТ КОРОБКИ ПЕРЕДАЧ</text>
</svg>
