<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t2">
  <title id="t2">Тормозная система — иллюстрация-заглушка</title>
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22303f" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121722"/>
      <stop offset="1" stop-color="#0c0f16"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>
  <rect width="800" height="600" fill="url(#grid2)"/>

  <!-- brake disc -->
  <g transform="translate(400,300)">
    <circle r="150" fill="none" stroke="#3a4a5c" stroke-width="3"/>
    <circle r="150" fill="none" stroke="#FFC53D" stroke-width="3" stroke-dasharray="6 10"/>
    <circle r="110" fill="#1b2330" stroke="#3a4a5c" stroke-width="2"/>
    <circle r="42" fill="#0c0f16" stroke="#4FA8FF" stroke-width="3"/>
    <circle r="10" fill="#4FA8FF"/>
    <g stroke="#3a4a5c" stroke-width="2">
      <circle r="66" cx="0" cy="-66" fill="#5b6b7c" stroke="none"/>
      <circle r="8" cx="0" cy="-80" fill="#0c0f16"/>
      <circle r="8" cx="58" cy="-40" fill="#0c0f16"/>
      <circle r="8" cx="58" cy="40" fill="#0c0f16"/>
      <circle r="8" cx="-58" cy="-40" fill="#0c0f16"/>
      <circle r="8" cx="-58" cy="40" fill="#0c0f16"/>
      <circle r="8" cx="0" cy="80" fill="#0c0f16"/>
    </g>
  </g>

  <!-- caliper -->
  <path d="M 500 220 L 560 220 L 580 260 L 580 340 L 560 380 L 500 380" fill="#1b2330" stroke="#FFC53D" stroke-width="3" stroke-linejoin="round"/>

  <text x="60" y="70" font-family="Arial, sans-serif" font-size="20" fill="#5b6b7c" letter-spacing="2">ТОРМОЗНАЯ СИСТЕМА</text>
</svg>
