<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t1">
  <title id="t1">Диагностика двигателя — иллюстрация-заглушка</title>
  <defs>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22303f" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121722"/>
      <stop offset="1" stop-color="#0c0f16"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg1)"/>
  <rect width="800" height="600" fill="url(#grid1)"/>

  <!-- engine block -->
  <g transform="translate(230,170)">
    <rect x="0" y="0" width="340" height="220" rx="14" fill="#1b2330" stroke="#3a4a5c" stroke-width="2"/>
    <rect x="24" y="24" width="292" height="60" rx="8" fill="#232d3c"/>
    <rect x="24" y="100" width="292" height="96" rx="8" fill="#232d3c"/>
    <circle cx="70" cy="54" r="14" fill="#0c0f16" stroke="#FFC53D" stroke-width="3"/>
    <circle cx="130" cy="54" r="14" fill="#0c0f16" stroke="#FFC53D" stroke-width="3"/>
    <circle cx="190" cy="54" r="14" fill="#0c0f16" stroke="#FFC53D" stroke-width="3"/>
    <circle cx="250" cy="54" r="14" fill="#0c0f16" stroke="#FFC53D" stroke-width="3"/>
  </g>

  <!-- OBD connector cable -->
  <path d="M 570 260 C 620 260 630 320 600 360 C 570 400 520 380 500 420" fill="none" stroke="#4FA8FF" stroke-width="4" stroke-linecap="round"/>
  <rect x="480" y="410" width="46" height="30" rx="6" fill="#0c0f16" stroke="#4FA8FF" stroke-width="3"/>

  <!-- scanner device -->
  <g transform="translate(560,150)">
    <rect x="0" y="0" width="120" height="180" rx="16" fill="#1b2330" stroke="#3a4a5c" stroke-width="2"/>
    <rect x="14" y="18" width="92" height="110" rx="6" fill="#0c0f16"/>
    <path d="M 24 100 L 44 60 L 60 90 L 76 40 L 96 100" fill="none" stroke="#FFC53D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="150" r="10" fill="none" stroke="#4FA8FF" stroke-width="3"/>
  </g>

  <text x="60" y="70" font-family="Arial, sans-serif" font-size="20" fill="#5b6b7c" letter-spacing="2">ДИАГНОСТИКА ДВИГАТЕЛЯ</text>
</svg>
