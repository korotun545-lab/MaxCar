<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t4">
  <title id="t4">Подвеска и рулевое управление — иллюстрация-заглушка</title>
  <defs>
    <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22303f" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121722"/>
      <stop offset="1" stop-color="#0c0f16"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg4)"/>
  <rect width="800" height="600" fill="url(#grid4)"/>

  <!-- coil spring -->
  <g transform="translate(300,140)" stroke="#FFC53D" stroke-width="6" fill="none" stroke-linecap="round">
    <ellipse cx="70" cy="20" rx="70" ry="18"/>
    <ellipse cx="70" cy="70" rx="70" ry="18"/>
    <ellipse cx="70" cy="120" rx="70" ry="18"/>
    <ellipse cx="70" cy="170" rx="70" ry="18"/>
    <ellipse cx="70" cy="220" rx="70" ry="18"/>
    <ellipse cx="70" cy="270" rx="70" ry="18"/>
  </g>

  <!-- strut rod -->
  <rect x="358" y="120" width="14" height="300" fill="#3a4a5c"/>
  <rect x="345" y="400" width="40" height="60" rx="6" fill="#1b2330" stroke="#4FA8FF" stroke-width="3"/>

  <!-- steering wheel -->
  <g transform="translate(560,300)">
    <circle r="90" fill="none" stroke="#4FA8FF" stroke-width="8"/>
    <circle r="22" fill="#1b2330" stroke="#3a4a5c" stroke-width="3"/>
    <line x1="0" y1="-90" x2="0" y2="-22" stroke="#4FA8FF" stroke-width="8"/>
    <line x1="-78" y1="45" x2="-19" y2="11" stroke="#4FA8FF" stroke-width="8"/>
    <line x1="78" y1="45" x2="19" y2="11" stroke="#4FA8FF" stroke-width="8"/>
  </g>

  <text x="60" y="70" font-family="Arial, sans-serif" font-size="20" fill="#5b6b7c" letter-spacing="2">ПОДВЕСКА И РУЛЕВОЕ</text>
</svg>
