<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="hero-t">
  <title id="hero-t">Автомобиль на подъёмнике — иллюстрация мастерской MaxCar</title>
  <defs>
    <pattern id="hgrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1c2431" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#1a2130"/>
      <stop offset="1" stop-color="#0a0d13"/>
    </radialGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161c26"/>
      <stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#hgrid)"/>
  <rect y="700" width="1600" height="300" fill="url(#floorGrad)"/>
  <line x1="0" y1="700" x2="1600" y2="700" stroke="#2a3444" stroke-width="2"/>

  <!-- lift columns -->
  <rect x="430" y="330" width="26" height="400" fill="#232c3a" stroke="#33404f" stroke-width="2"/>
  <rect x="1000" y="330" width="26" height="400" fill="#232c3a" stroke="#33404f" stroke-width="2"/>

  <!-- lift arms + platform -->
  <rect x="410" y="560" width="640" height="20" rx="6" fill="#2c3846" stroke="#3a4a5c" stroke-width="2"/>

  <!-- car body (side silhouette, generic) -->
  <g transform="translate(430,430)">
    <path d="M0 130
             C 10 90, 60 70, 110 66
             L 170 40
             C 200 24, 260 22, 300 40
             L 380 68
             C 430 72, 470 92, 480 130
             L 560 130
             L 560 150
             L 0 150 Z"
          fill="#182130" stroke="#3a4a5c" stroke-width="3"/>
    <path d="M175 42 C 205 26 258 24 296 42 L 330 66 L 190 66 Z" fill="#101722" stroke="#3a4a5c" stroke-width="2"/>
    <circle cx="90" cy="152" r="34" fill="#0c0f16" stroke="#FFC53D" stroke-width="4"/>
    <circle cx="90" cy="152" r="12" fill="#232c3a"/>
    <circle cx="460" cy="152" r="34" fill="#0c0f16" stroke="#FFC53D" stroke-width="4"/>
    <circle cx="460" cy="152" r="12" fill="#232c3a"/>
    <rect x="20" y="96" width="44" height="10" rx="4" fill="#4FA8FF" opacity="0.7"/>
  </g>

  <!-- hanging tool / lamp -->
  <line x1="720" y1="0" x2="720" y2="170" stroke="#2a3444" stroke-width="3"/>
  <circle cx="720" cy="185" r="20" fill="#1b2330" stroke="#FFC53D" stroke-width="3"/>

  <!-- floor reflection lines -->
  <g stroke="#1c2431" stroke-width="2">
    <line x1="120" y1="760" x2="1480" y2="760"/>
    <line x1="180" y1="820" x2="1420" y2="820"/>
    <line x1="260" y1="880" x2="1340" y2="880"/>
  </g>
</svg>
